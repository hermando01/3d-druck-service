<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein 3D-Druck Service</title>
    
    <!-- Tally Popup Script -->
    <script async src="https://tally.so/widgets/embed.js"></script>
    
    <style>
        :root {
            --bambu-green: #00A65A; 
            --bambu-green-hover: #00894A;
            --bambu-light: rgba(0, 166, 90, 0.12);
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-muted: #4b5563;
            --border-color: #e5e7eb;
            --box-bg: #f9fafb;
            --spool-plastic: #374151;
            --highlight-bg: #eef2ff;
            --highlight-text: #4338ca;
            --danger: #ef4444;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --card-bg: #1e293b;
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
                --border-color: #334155;
                --box-bg: #0f172a;
                --spool-plastic: #94a3b8;
                --highlight-bg: rgba(67, 56, 202, 0.25);
                --highlight-text: #c7d2fe;
            }
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding-bottom: 100px;
            line-height: 1.5;
        }

        .container {
            max-width: 1040px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        @media (min-width: 820px) {
            .container { grid-template-columns: 1fr 1fr; }
            .full-width { grid-column: 1 / -1; }
        }

        .section-card {
            background: var(--card-bg);
            padding: 28px;
            border-radius: 22px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--border-color);
            height: fit-content;
        }

        h1 { font-size: 30px; margin: 0 0 12px 0; letter-spacing: -0.5px; }
        h2 { font-size: 21px; margin: 0 0 16px 0; border-bottom: 2px solid var(--border-color); padding-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
        p { color: var(--text-muted); font-size: 15px; margin: 0 0 16px 0; }

        /* --- HERO & BILDER --- */
        .hero-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
            align-items: center;
        }
        @media (min-width: 760px) {
            .hero-grid { grid-template-columns: 1.1fr 0.9fr; }
        }

        .image-placeholder {
            width: 100%;
            height: auto;
            max-height: 320px;
            background-color: var(--box-bg);
            border-radius: 16px;
            object-fit: cover;
            border: 1px solid var(--border-color);
            display: block;
        }

        .printers { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
        .badge { 
            background-color: var(--bambu-light); 
            color: var(--bambu-green); 
            padding: 6px 14px; 
            border-radius: 20px; 
            font-size: 13px; 
            font-weight: 700; 
            border: 1px solid rgba(0, 166, 90, 0.3);
            user-select: none;
        }

        /* --- INTERAKTIONSSTRUKTUR: 3 SCHRITTE LEISTE --- */
        .steps-bar {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
            margin-top: 22px;
            padding-top: 22px;
            border-top: 1px solid var(--border-color);
        }
        @media (min-width: 650px) {
            .steps-bar { grid-template-columns: repeat(3, 1fr); }
        }
        .step-box {
            background-color: var(--box-bg);
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .step-num {
            background-color: var(--bambu-green);
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            flex-shrink: 0;
        }
        .step-text strong { display: block; font-size: 14px; color: var(--text-main); margin-bottom: 2px; }
        .step-text span { font-size: 13px; color: var(--text-muted); }

        /* --- MATERIAL & INTERAKTIVE ENTSCHEIDUNGSHILFE --- */
        .material-controls {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }
        @media (min-width: 650px) {
            .material-controls { grid-template-columns: 280px 1fr; align-items: stretch; }
        }

        .material-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 14px;
            color: var(--text-main);
        }

        .custom-select {
            width: 100%;
            padding: 14px 16px;
            background-color: var(--box-bg);
            color: var(--text-main);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }
        .custom-select:focus { border-color: var(--bambu-green); }

        .material-helper-box {
            background-color: var(--box-bg);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--bambu-green);
            padding: 14px 18px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .material-helper-box strong { font-size: 15px; margin-bottom: 4px; color: var(--text-main); }
        .material-helper-box span { font-size: 14px; color: var(--text-muted); }

        /* --- SPULEN-OPTIK --- */
        .color-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 10px;
        }
        .color-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: var(--box-bg);
            color: var(--text-main);
            padding: 9px 18px 9px 12px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid var(--border-color);
            transition: transform 0.15s;
        }
        .color-item:hover { transform: translateY(-2px); }
        
        .spool-icon {
            width: 26px; height: 26px;
            border-radius: 50%;
            border: 4px solid var(--spool-plastic);
            position: relative;
            box-shadow: inset 0 0 4px rgba(0,0,0,0.4);
            flex-shrink: 0;
        }
        .spool-icon::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 6px; height: 6px;
            background-color: var(--spool-plastic);
            border-radius: 50%;
        }

        .special-request-box {
            background-color: var(--highlight-bg);
            color: var(--highlight-text);
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 22px;
        }

        /* --- PLATTFORM KARTEN --- */
        .step-list { margin: 0 0 18px 0; padding-left: 20px; color: var(--text-muted); font-size: 14px; }
        .step-list li { margin-bottom: 6px; }
        .platform-btn { 
            display: inline-flex; 
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            text-decoration: none; 
            background-color: var(--box-bg); 
            color: var(--text-main); 
            padding: 12px 20px; 
            border-radius: 12px; 
            font-weight: 700; 
            font-size: 15px; 
            border: 1px solid var(--border-color); 
            transition: all 0.2s;
        }
        .platform-btn:hover {
            border-color: var(--bambu-green);
            color: var(--bambu-green);
            transform: translateY(-2px);
        }

        /* --- STICKY FOOTER --- */
        .sticky-footer { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            background-color: var(--card-bg); 
            border-top: 1px solid var(--border-color); 
            padding: 14px 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            gap: 15px;
            z-index: 900; 
            box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
        }
        button.tally-btn { 
            background-color: var(--bambu-green); 
            color: white; 
            border: none; 
            padding: 16px 32px; 
            font-size: 16px;
